services:
  redis:
    image: redis:latest
    container_name: redis-stream
    ports:
      - "6379:6379"
    command: redis-server --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - comment-network

  mongodb:
    image: mongo:7
    container_name: mongodb-local
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - comment-network

  consumer:
    # 사용자 요청(환경변수 외부 분리 + Docker 이미지 실행)에 따라 Node consumer 컨테이너를 추가함
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comment-consumer
    env_file:
      # 외부 파일에서 consume 관련 값(READ_BLOCK_MS 등) 포함 모든 env를 조정할 수 있음
      - ./consumer.env
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - comment-network

volumes:
  mongodb_data:
  redis_data:

networks:
  comment-network:
    driver: bridge
