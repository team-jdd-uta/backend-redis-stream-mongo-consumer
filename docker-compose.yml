services:
  redis:
    image: redis:latest
    container_name: redis-stream
    ports:
      - "6379:6379"
    command: redis-server --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - comment-network

  mongodb:
    image: mongo:7
    container_name: mongodb-local
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - comment-network

volumes:
  mongodb_data:
  redis_data:

networks:
  comment-network:
    driver: bridge

