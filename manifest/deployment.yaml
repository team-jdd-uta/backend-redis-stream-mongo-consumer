apiVersion: apps/v1
kind: Deployment
metadata:
  name: comment-consumer
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: comment-consumer
  template:
    metadata:
      labels:
        app: comment-consumer
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: comment-consumer
          image: amdp-registry.skala-ai.com/skala26a-cloud/team9-comment-consumer:1.0.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: comment-consumer-config
            - secretRef:
                name: comment-consumer-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - test -n "$REDIS_URL" && test -n "$MONGO_URI"
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f "node src/app.js" >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
