apiVersion: v1
kind: Namespace
metadata:
  name: comment-app
---
# Redis StatefulSet용 Headless Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: comment-app
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# Redis StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: comment-app
spec:
  serviceName: "redis"
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:latest
          command: ["redis-server", "--loglevel", "warning"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Node.js consumer Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comment-consumer
  namespace: comment-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comment-consumer
  template:
    metadata:
      labels:
        app: comment-consumer
    spec:
      containers:
        - name: comment-consumer
          image: amdp-registry.skala-ai.com/skala26a-cloud/team9-comment-consumer:1.0.0
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017"
          securityContext:
            runAsUser: 0

